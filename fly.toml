app = "proofsheet"
primary_region = "sjc"

[build]
  dockerfile = "apps/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

[processes]
  web = "pnpm --filter @proofsheet/web start"
  worker = "pnpm --filter @proofsheet/worker start"
