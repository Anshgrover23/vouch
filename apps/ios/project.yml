name: Vouch
options:
  bundleIdPrefix: com.anshgrover
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Vouch:
    type: application
    platform: iOS
    sources:
      - path: Vouch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshgrover.vouch
        PRODUCT_NAME: Vouch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Vouch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_TEAM: 5LBN2CS3KH
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Vouch/Info.plist
      properties:
        CFBundleDisplayName: Vouch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Lime
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Vouch uses the camera to snap a receipt so housemates can tap the items they owe.
        NSPhotoLibraryUsageDescription: Vouch reads a receipt photo you pick so the split cites the paper.
